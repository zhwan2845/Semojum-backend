# 운영(EC2 docker compose) — compose 가 SPRING_PROFILES_ACTIVE=prod 로 켠다.
# 비밀값(DB · JWT 등)은 여기 두지 않고 compose 환경변수로만 받는다
spring:
  data:
    redis:
      host: redis   # compose 내부 네트워크의 서비스 이름 — 서버 밖으로 열지 않는다
      port: 6379

grpc:
  ai:
    # AI 서버는 같은 VPC(AWS 서울)에 있으므로 사설 IP로 접속한다.
    # 공인 IP로 가면 트래픽이 VPC를 벗어나 AI 보안그룹의 "BE 보안그룹 허용" 규칙에 걸리지 않아 차단된다.
    # (전송비 0원·지연 감소 효과도 있음) 서버 증설·슬롯 조정은 환경변수 수정 + 재시작으로 끝.
    servers: ${GRPC_AI_SERVERS:172.20.1.10:50051:4}

hwp2pdf:
  script: ${HWP2PDF_SCRIPT:/app/hwp2odt.py}   # Dockerfile 이 이미지에 넣는 위치

# 점자 규정 경로(rules.path)는 여기 두지 않는다 — compose 의 RULES_PATH 가 볼륨 연결과 한 곳에서 짝을 이룬다
