# 블루그린 무중단 배포 (2026-08-16 전환)
# - backend가 blue/green 2색으로 나뉘고, 평소엔 한 색만 떠 있다 (deploy.sh가 관리)
# - Envoy가 두 색을 액티브 헬스체크로 감시해 살아있는 쪽으로 라우팅
# - 배포: 새 이미지를 비활성 색으로 기동 → 헬스 통과 → 구 색 graceful 정지 (다운타임 0)
# - 색 서비스는 profiles라 `docker compose up -d`로는 뜨지 않는다 — 반드시 deploy.sh 사용
#   (수동 기동: docker compose --profile blue up -d backend-blue)

x-backend-common: &backend-common
  # 비공개 ECR, 커밋 해시 태그(2026-10-27). deploy.sh 가 .env 의 BACKEND_IMAGE 를 배포한 이미지로 갱신한다
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE 필요 — deploy.sh 가 .env 에 넣는다}
  # 배포 스크립트가 색을 명시적으로 켜고 끈다 — 재부팅 시 unless-stopped가 마지막 상태 복원
  restart: unless-stopped
  # graceful shutdown(앱 20s) + 여유 — 처리 중 요청을 마저 끝낸 뒤 내려간다
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  environment:
    - DB_HOST=${DB_HOST}
    - DB_PASSWORD=${DB_PASSWORD}
    - JWT_SECRET=${JWT_SECRET}
    - SPRING_PROFILES_ACTIVE=prod
    - GRPC_CERT_PATH=${GRPC_CERT_PATH}
    # 문의 메일함 연동 (Google Workspace IMAP — 미설정 시 폴러 비활성, fail-safe)
    - MAIL_INBOX_USERNAME=${MAIL_INBOX_USERNAME:-}
    - MAIL_INBOX_PASSWORD=${MAIL_INBOX_PASSWORD:-}
    # 운영자 콘솔 Origin 목록 (V28 — 콘솔 로그인은 웹 관리자 전용).
    # ⚠️ 빈 값으로 넘기면 yaml 기본값을 덮어버리므로(빈 문자열도 "설정됨") 여기에도 기본값을 둔다
    - ADMIN_CONSOLE_ORIGINS=${ADMIN_CONSOLE_ORIGINS:-http://203.0.113.10,https://admin.example.com}
    # HWP→PDF 변환 단계별 타임아웃(초) — .env로 재배포 없이 조정 가능
    - HWP2PDF_TIMEOUT_SECONDS=${HWP2PDF_TIMEOUT_SECONDS:-300}
    # 원본 미리보기 이미지 — 문제 시 PAGE_IMAGE_ENABLED=false로 즉시 PDF 방식 회귀 가능
    - PAGE_IMAGE_ENABLED=${PAGE_IMAGE_ENABLED:-true}
    - PAGE_IMAGE_DPI=${PAGE_IMAGE_DPI:-150}
    - PDF_RENDER_TIMEOUT_SECONDS=${PDF_RENDER_TIMEOUT_SECONDS:-60}
    - S3_BUCKET=${S3_BUCKET}
    - AWS_REGION=${AWS_REGION}
    # 서비스가 국내 전용이라 서버 시간을 KST로 고정한다.
    # UTC로 두면 LocalDateTime.now()가 9시간 이른 값을 써서 "어제/오늘" 판정이 어긋난다.
    - TZ=Asia/Seoul
    # 점자 규정 검색 데이터 — EC2 에 clone 한 Semojum/braille-reference(아래 volumes). 비공개 데이터라 이미지에 넣지 않는다
    - RULES_PATH=/app/braille-reference/rules.json
    # -Xmx768m: 전환 창(두 색 동시 가동 ~30초)에 JVM 2개가 떠도 합계가 가용 메모리(3.7GB) 안에
    # 갇히도록 힙 상한 고정 (기본값은 RAM 25%=960MB×2 + 네이티브라 이론상 최악에서 초과 가능)
    - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Seoul -Xmx768m
  depends_on:
    - redis
  volumes:
    # 호스트 경로를 compose 파일 기준 상대경로로 (어느 VM에서든 동작)
    - ./server.crt:/app/certs/server.crt:ro
    # 파일이 아니라 폴더째 연결한다 — git pull 은 파일을 새로 써서 바꾸므로(inode 교체) 파일만 연결하면
    # 컨테이너가 옛 파일을 계속 본다. 갱신은 cron 의 git pull + 서버의 1분 주기 확인으로 반영된다
    - ./braille-reference:/app/braille-reference:ro

services:
  envoy:
    image: envoyproxy/envoy:v1.29-latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "80:80"
      # 직접 TLS 종료 (2026-08-26) — Let's Encrypt 인증서는 ./tls (certbot deploy hook이 갱신)
      - "443:443"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./tls:/etc/envoy/tls:ro
    # 색 서비스는 profiles라 depends_on을 걸 수 없다 — Envoy는 DNS 재조회(5s)로 알아서 찾는다

  backend-blue:
    <<: *backend-common
    profiles: ["blue"]
    ports:
      - "8081:8080"   # deploy.sh 헬스체크용 (외부 트래픽은 Envoy:80 경유, SG는 8081 비공개)

  backend-green:
    <<: *backend-common
    profiles: ["green"]
    ports:
      - "8082:8080"   # deploy.sh 헬스체크용

  redis:
    # 버전 고정(2026-10-27) — latest 면 컨테이너를 다시 만들 때 메이저 버전이 예고 없이 바뀐다.
    # 8.8 = 그때 운영 중이던 8.8.1 의 마이너 줄. 8.8.x 보안 패치는 받고 8.9 · 9.x 는 직접 올린다
    image: redis:8.8
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # ⚠️ ports 를 두지 않는다(2026-10-27) — 비밀번호 없는 Redis 가 서버 밖(0.0.0.0:6379)으로 열려 있었다.
    # 백엔드는 compose 내부 네트워크로 `redis:6379` 에 붙고, 운영 확인은 `docker exec semojum-redis-1 redis-cli` 로 한다
